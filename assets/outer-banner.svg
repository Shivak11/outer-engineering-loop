<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="OUTER: Outcome, Unacceptable, Trade-offs, Evidence, Recovery. Five questions your coding agent answers in plain English, before it changes a single file.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .f    { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .word { font-size: 23px; font-weight: 500; fill: #cbd5e1; }
      .cap  { font-size: 23px; font-weight: 800; fill: #f59e0b; }
      .dot  { font-size: 23px; fill: #475569; }
      .tag  { font-size: 19px; font-weight: 400; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="5" fill="#f59e0b"/>

  <text class="f" x="508" y="130" text-anchor="middle"
        font-size="100" font-weight="800" fill="#f8fafc" letter-spacing="16">OUTER</text>

  <text class="f" x="500" y="188" text-anchor="middle" xml:space="preserve"><tspan class="cap">O</tspan><tspan class="word">utcome</tspan><tspan class="dot">   ·   </tspan><tspan class="cap">U</tspan><tspan class="word">nacceptable</tspan><tspan class="dot">   ·   </tspan><tspan class="cap">T</tspan><tspan class="word">rade-offs</tspan><tspan class="dot">   ·   </tspan><tspan class="cap">E</tspan><tspan class="word">vidence</tspan><tspan class="dot">   ·   </tspan><tspan class="cap">R</tspan><tspan class="word">ecovery</tspan></text>

  <line x1="340" y1="220" x2="660" y2="220" stroke="#334155" stroke-width="1"/>

  <text class="f tag" x="500" y="252" text-anchor="middle">Five questions your coding agent answers in plain English,</text>
  <text class="f tag" x="500" y="276" text-anchor="middle">before it changes a single file.</text>
</svg>
